<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ETLoom{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/etloom.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">E</span>
        <span>ETLoom</span>
      </a>
      <div class="topbar-meta">
        <span class="status-dot"></span>
        Local control plane
        <span class="version">v{{ version }}</span>
      </div>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</html>
