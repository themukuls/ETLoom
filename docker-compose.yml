services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etloom
      POSTGRES_PASSWORD: etloom_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - etloom_postgres:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etloom -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  etloom_postgres:

